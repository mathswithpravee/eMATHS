<!DOCTYPE html>
<html>

<head>

<title>Video Lessons - Maths with Pravee</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
font-family:Arial;
background:#f4f7fb;
text-align:center;
}


.header{
background:#1e88e5;
color:white;
padding:20px;
}


.card{

background:white;
width:90%;
max-width:700px;
margin:20px auto;
padding:20px;
border-radius:10px;

}


select{

width:80%;
padding:12px;
font-size:16px;

}



.video{

background:#eee;
margin:20px;
padding:15px;
border-radius:10px;

}


.video img{

width:100%;
border-radius:10px;

}


.video button{

background:#1e88e5;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;

}


</style>

</head>


<body>


<div class="header">

<h1>🎥 Maths Lessons</h1>

<h3>Maths with Pravee</h3>

</div>




<div class="card">


<h2>Select Grade</h2>


<select id="gradeSelect" onchange="loadVideos()">



<option value="">
Select Grade
</option>


<option value="6">
Grade 6
</option>


<option value="7">
Grade 7
</option>


<option value="8">
Grade 8
</option>


<option value="9">
Grade 9
</option>


<option value="10">
Grade 10
</option>


<option value="11">
Grade 11
</option>


</select>


</div>





<div id="videoList">

</div>






<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getFirestore,

collection,

getDocs,

query,

where

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);






window.loadVideos = async function(){



const grade =

document.getElementById("gradeSelect").value;



const box =

document.getElementById("videoList");



box.innerHTML="";



if(grade=="") return;





const q =

query(

collection(db,"videos"),

where("grade","==",grade)

);






const snapshot =

await getDocs(q);






if(snapshot.empty){


box.innerHTML =

`

<div class="card">

<h3>No Videos Available</h3>

</div>

`;


return;


}





snapshot.forEach((doc)=>{



const data = doc.data();




box.innerHTML +=



`

<div class="card video">


<h3>${data.name}</h3>


<img src="${data.thumbnail}">



<br><br>



<button onclick="openVideo('${data.link}')">

▶ Watch Video

</button>



</div>


`;




});



};








window.openVideo = function(link){


window.open(link,"_blank");


};





</script>



</body>

</html>
