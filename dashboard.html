<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard - Maths with Pravee</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    text-align:center;
}

.header{
    background:#1e88e5;
    color:white;
    padding:25px;
}

.card{
    background:white;
    width:80%;
    margin:20px auto;
    padding:20px;
    border-radius:10px;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:5px;
    background:#1e88e5;
    color:white;
}


table{
    width:100%;
    border-collapse:collapse;
}


th,td{

padding:10px;

border:1px solid #ddd;

}

*{
    box-sizing:border-box;
}


body{
    margin:0;
    padding:0;
}


.card{
    width:95%;
    max-width:700px;
    margin:20px auto;
    padding:15px;
}


button{
    width:90%;
    max-width:300px;
    padding:12px;
    margin:8px;
}


canvas{
    max-width:100%;
}


table{
    width:100%;
    font-size:14px;
}



@media(max-width:600px){

.header{
    padding:15px;
}


.header h1{
    font-size:24px;
}


.header h3{
    font-size:18px;
}


.card{
    width:95%;
    padding:12px;
}


table{
    font-size:11px;
}

}
</style>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>



<body>



<div class="header">

<h1>Maths with Pravee</h1>

<h3>Student Dashboard</h3>

</div>




<div class="card">

<h2>Welcome 👋</h2>


<p id="studentName">
Loading...
</p>


<p id="studentGrade"></p>


<p id="studentIndex"></p>


</div>




<div class="card">


<h2>Learning</h2>


<button>📚 Lessons</button>


<button>🎥 Videos</button>


<button>📄 Notes</button>


</div>





<div class="card">


<h2>Academic</h2>


<button onclick="openExam()">
📝 Exams
</button>


</div>





<div class="card">


<h2>📈 Performance Summary</h2>


<p id="average">
Average: Loading...
</p>


<p id="bestResult">
Best Result: Loading...
</p>


<p id="testCount">
Tests Completed: Loading...
</p>



</div>





<div class="card">


<h2>📊 Monthly Results</h2>


<table>


<tr style="background:#1e88e5;color:white;">


<th>Month</th>

<th>Exam</th>

<th>Marks</th>

<th>Total</th>

<th>%</th>

<th>Rank</th>


</tr>



<tbody id="marksTable">


</tbody>



</table>


</div>





<div class="card">


<h2>📈 My Progress</h2>


<canvas id="progressChart"></canvas>


</div>
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
doc,
getDoc,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const indexNo = localStorage.getItem("studentIndex");



async function loadStudent(){


if(!indexNo){

document.getElementById("studentName").innerHTML =
"Please Login First";

return;

}



const studentRef =
doc(db,"students",indexNo);



const studentSnap =
await getDoc(studentRef);



if(studentSnap.exists()){


const data =
studentSnap.data();



document.getElementById("studentName").innerHTML =
"Name: " + data.name;



document.getElementById("studentGrade").innerHTML =
"Grade: " + data.grade;



document.getElementById("studentIndex").innerHTML =
"Index No: " + indexNo;




const marksRef =
collection(db,"students",indexNo,"monthlyMarks");



const marksSnap =
await getDocs(marksRef);




let table = "";

let totalPercentage = 0;

let bestPercentage = 0;

let count = 0;


let chartLabels = [];

let chartData = [];




marksSnap.forEach((doc)=>{


const mark = doc.data();


const examMonth = doc.id;


const parts = examMonth.split("-");


const displayMonth =
new Date(parts[0],parts[1]-1)
.toLocaleString("default",{

month:"long",

year:"numeric"

});



table += `

<tr>

<td>${displayMonth}</td>

<td>${mark.exam}</td>

<td>${mark.marks}</td>

<td>${mark.total}</td>

<td>${mark.percentage}%</td>

<td>${mark.rank}</td>

</tr>

`;



totalPercentage += Number(mark.percentage);



if(Number(mark.percentage) > bestPercentage){

bestPercentage = Number(mark.percentage);

}



count++;



chartLabels.push(displayMonth);


chartData.push(mark.percentage);



});





document.getElementById("marksTable").innerHTML =
table;




if(count > 0){


let average =
(totalPercentage / count).toFixed(2);



document.getElementById("average").innerHTML =
"Average: " + average + "%";



document.getElementById("bestResult").innerHTML =
"Best Result: " + bestPercentage + "%";



document.getElementById("testCount").innerHTML =
"Tests Completed: " + count;



}

else{


document.getElementById("average").innerHTML =
"Average: No Results";


document.getElementById("bestResult").innerHTML =
"Best Result: No Results";


document.getElementById("testCount").innerHTML =
"Tests Completed: 0";


}




new Chart(

document.getElementById("progressChart"),

{


type:"line",


data:{


labels:chartLabels,


datasets:[{

label:"Percentage %",

data:chartData,

borderWidth:3

}]


},


options:{


responsive:true


}


}


);



}


else{


document.getElementById("studentName").innerHTML =
"Student not found";


}



}



loadStudent();
</script>
<script>

function openExam(){

window.location.href="exam.html";

}


</script>
