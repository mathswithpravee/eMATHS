<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard - Maths with Pravee</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

body{
font-family:Arial;
background:#f4f7fb;
text-align:center;
margin:0;
}


.header{
background:#1e88e5;
color:white;
padding:20px;
}


.card{
background:white;
width:95%;
max-width:700px;
margin:20px auto;
padding:15px;
border-radius:10px;
}


button{

background:#1e88e5;
color:white;
border:none;
padding:12px;
margin:8px;
border-radius:5px;
width:90%;
max-width:300px;

}


table{

width:100%;
border-collapse:collapse;

}


th,td{

border:1px solid #ddd;
padding:8px;

}


th{

background:#1e88e5;
color:white;

}


canvas{

max-width:100%;

}


</style>


</head>


<body>


<div class="header">

<h1>Maths with Pravee</h1>

<h3>Student Dashboard</h3>

</div>



<div class="card">

<h2>Welcome 👋</h2>

<p id="studentName">Loading...</p>

<p id="studentGrade"></p>

<p id="studentIndex"></p>

</div>





<div class="card">

<h2>Learning</h2>

<button onclick="openLessons()">
📚 Lessons
</button>


<button onclick="openVideos()">
🎥 Videos
</button>


<button>
📄 Notes
</button>

</div>





<div class="card">

<h2>Academic</h2>


<button onclick="openExam()">

📝 Exams

</button>


</div>






<div class="card">

<h2>📈 Performance Summary</h2>


<p id="average">
Average: Loading...
</p>


<p id="bestResult">
Best Result: Loading...
</p>


<p id="testCount">
Tests Completed: Loading...
</p>


</div>







<div class="card">

<h2>📊 Monthly Results</h2>


<table>


<tr>

<th>Month</th>

<th>Exam</th>

<th>Marks</th>

<th>Total</th>

<th>%</th>

<th>Rank</th>


</tr>


<tbody id="marksTable">

</tbody>


</table>

</div>







<div class="card">

<h2>📝 My Quiz Results</h2>


<table>


<tr>

<th>Exam</th>

<th>Score</th>

<th>%</th>

<th>Date</th>


</tr>


<tbody id="quizResultsTable">

</tbody>


</table>


</div>







<div class="card">


<h2>📈 My Progress</h2>


<canvas id="progressChart"></canvas>


</div>





<script>


function openExam(){

window.location.href="exam.html";

}


function openLessons(){

window.location.href="lessons.html";

}


function openVideos(){

window.location.href="videos.html";

}


</script>

  <script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

doc,

getDoc,

collection,

getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {

apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"

};





const app = initializeApp(firebaseConfig);

const db = getFirestore(app);





const indexNo = localStorage.getItem("studentIndex");





async function loadStudent(){


try{


if(!indexNo){

document.getElementById("studentName").innerHTML =
"Please Login First";

return;

}





const studentSnap = await getDoc(

doc(db,"students",indexNo)

);





if(!studentSnap.exists()){


document.getElementById("studentName").innerHTML =
"Student Not Found";


return;


}





const student = studentSnap.data();





document.getElementById("studentName").innerHTML =
"Name : "+student.name;


document.getElementById("studentGrade").innerHTML =
"Grade : "+student.grade;


document.getElementById("studentIndex").innerHTML =
"Index No : "+indexNo;






// MONTHLY RESULTS


const marksSnap = await getDocs(

collection(
db,
"students",
indexNo,
"monthlyMarks"
)

);





let table="";

let total=0;

let best=0;

let count=0;

let labels=[];

let values=[];






marksSnap.forEach((item)=>{


const mark=item.data();


let percentage =
Number(mark.percentage || 0);





table += `


<tr>

<td>${item.id}</td>

<td>${mark.exam || "-"}</td>

<td>${mark.marks || 0}</td>

<td>${mark.total || 0}</td>

<td>${percentage}%</td>

<td>${mark.rank || "-"}</td>

</tr>


`;





total += percentage;

count++;


if(percentage > best){

best=percentage;

}



labels.push(item.id);

values.push(percentage);



});






document.getElementById("marksTable").innerHTML =
table;






if(count>0){


document.getElementById("average").innerHTML =
"Average : "+(total/count).toFixed(2)+"%";


document.getElementById("bestResult").innerHTML =
"Best Result : "+best+"%";


document.getElementById("testCount").innerHTML =
"Tests Completed : "+count;



}
else{


document.getElementById("average").innerHTML =
"Average : No Results";


document.getElementById("bestResult").innerHTML =
"Best Result : No Results";


document.getElementById("testCount").innerHTML =
"Tests Completed : 0";


}







// QUIZ RESULTS


const quizSnap = await getDocs(

collection(
db,
"students",
indexNo,
"examResults"
)

);





let quizHTML="";



quizSnap.forEach((item)=>{


const q=item.data();


let date="-";


if(q.date && q.date.seconds){


date =
new Date(
q.date.seconds*1000
).toLocaleDateString();


}





quizHTML += `


<tr>

<td>${q.exam}</td>

<td>${q.score}/${q.total}</td>

<td>${q.percentage}%</td>

<td>${date}</td>

</tr>


`;



});





document.getElementById("quizResultsTable").innerHTML =
quizHTML;








// GRAPH


if(labels.length>0){



new Chart(

document.getElementById("progressChart"),

{


type:"line",


data:{


labels:labels,


datasets:[{


label:"Percentage %",


data:values,


borderWidth:3


}]


},


options:{


responsive:true,


scales:{


y:{


beginAtZero:true,


max:100


}


}


}



}


);



}





}

catch(error){

console.error("DASHBOARD ERROR:",error);

alert(error.message);



}



}





loadStudent();



</script>


</body>

</html>
