<!DOCTYPE html>
<html>

<head>

<body>


<div class="header">

<h1>Maths with Pravee</h1>

<h3>Admin Dashboard</h3>

<div class="card">

<h2>➕ Add Student</h2>

<input id="name" placeholder="Student Name">

<input id="email" placeholder="Email">

<input id="password" placeholder="Password">

<button onclick="addStudent()">
Save Student
</button>


<p id="message"></p>

<div class="card">

<h2>📊 Add Monthly Marks</h2>


<select id="markGrade">

<option value="">Select Grade</option>

<option value="6">Grade 6</option>

<option value="7">Grade 7</option>

<option value="8">Grade 8</option>

<option value="9">Grade 9</option>

<option value="10">Grade 10</option>

<option value="11">Grade 11</option>
<br><br>
</select>

<select id="testType">

<option value="">Select Test Type</option>

<option value="Monthly">Monthly Test</option>

<option value="Term">Term Test</option>

<option value="Paper">Paper Class</option>

</select>

<br><br>


<select id="markIndex">

<option value="">
Select Student
</option>


</select>


<br><br>


<input id="exam" placeholder="Exam Name">

<br><br>


<select id="year">

<option value="">Select Year</option>

<option value="2026">2026</option>

<option value="2027">2027</option>

</select>


<br><br>


<select id="month">

<option value="">Select Month</option>

<option value="01">January</option>

<option value="02">February</option>

<option value="03">March</option>

<option value="04">April</option>

<option value="05">May</option>

<option value="06">June</option>

<option value="07">July</option>

<option value="08">August</option>

<option value="09">September</option>

<option value="10">October</option>

<option value="11">November</option>

<option value="12">December</option>

</select>

<br><br>
<div id="monthlyBox">

<select id="year">

<option value="">Select Year</option>

<option value="2026">2026</option>

<option value="2027">2027</option>

</select>

<br><br>

<select id="month">

<option value="">Select Month</option>

<option value="01">January</option>
<option value="02">February</option>
<option value="03">March</option>
<option value="04">April</option>
<option value="05">May</option>
<option value="06">June</option>
<option value="07">July</option>
<option value="08">August</option>
<option value="09">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>

</select>

</div>



<div id="termBox" style="display:none;">

<select id="term">

<option value="">Select Term</option>

<option value="1">Term 1</option>

<option value="2">Term 2</option>

<option value="3">Term 3</option>

</select>

</div>



<div id="paperBox" style="display:none;">

<input id="paperNo" placeholder="Paper Number">

</div>

<br><br>

<input id="marks" placeholder="Marks">

<br><br>


<input id="total" placeholder="Total Marks">

<br><br>


<input id="percentage" placeholder="Percentage" readonly>
<script>

document.getElementById("marks")
.addEventListener("input", calculatePercentage);

document.getElementById("total")
.addEventListener("input", calculatePercentage);


function calculatePercentage(){

const marks =
Number(document.getElementById("marks").value);


const total =
Number(document.getElementById("total").value);


if(total > 0){

const percentage = (marks / total) * 100;


document.getElementById("percentage").value =
percentage.toFixed(2);

}

}

</script>

<br><br>


<input id="rank" placeholder="Rank" readonly>


<br><br>


<button onclick="addMarks()">

Save Marks

</button>


<p id="markMessage"></p>


</div>
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
doc,
setDoc,
collection,
getDocs,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// =====================
// LOAD STUDENTS BY GRADE
// =====================


const gradeSelect =
document.getElementById("markGrade");


const studentSelect =
document.getElementById("markIndex");



gradeSelect.addEventListener("change", async ()=>{


studentSelect.innerHTML =
`
<option value="">
Select Student
</option>
`;



const selectedGrade =
gradeSelect.value;



const studentsRef =
collection(db,"students");



const snapshot =
await getDocs(studentsRef);



snapshot.forEach((student)=>{


const data = student.data();



if(String(data.grade) === String(selectedGrade)){


let option =
document.createElement("option");



option.value =
student.id;



option.textContent =
student.id + " - " + data.name;



studentSelect.appendChild(option);


}



});


});




// =====================
// ADD STUDENT
// =====================


window.addStudent = async function(){


try{


const indexNo =
document.getElementById("indexNo").value;


const name =
document.getElementById("name").value;


const grade =
document.getElementById("grade").value;


const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

await setDoc(

doc(db,"students",indexNo),

{

name:name,

grade:grade,

email:email,
  
password:password,
}

);



document.getElementById("message").innerHTML =
"Student Added Successfully ✅";



}

catch(error){


document.getElementById("message").innerHTML =
error.message;


}


};





// =====================
// ADD MONTHLY MARKS
// =====================


window.addMarks = async function(){


try{


const indexNo =
document.getElementById("markIndex").value;


const exam =
document.getElementById("exam").value;

const testType =
document.getElementById("testType").value;

let examId = "";
let examName = "";


if(testType == "Monthly"){

const year =
document.getElementById("year").value;

const month =
document.getElementById("month").value;

examId = year + "-" + month;

const monthNames = [
"",
"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"
];

examName =
monthNames[Number(month)] + " Monthly Test";

}

else if(testType == "Term"){

const year =
document.getElementById("year").value;

const term =
document.getElementById("term").value;

examId =
year + "-Term" + term;

examName =
"Term " + term + " Test";

}

else if(testType == "Paper"){

const year =
document.getElementById("year").value;

const paperNo =
document.getElementById("paperNo").value;

examId =
year + "-Paper" + paperNo;

examName =
"Paper Class " + paperNo;

}



const marks =
Number(document.getElementById("marks").value);



const total =
Number(document.getElementById("total").value);



const percentage =
(marks / total) * 100;

let rank = 1;

const selectedGrade =
document.getElementById("markGrade").value;


const studentsRef =
collection(db,"students");


const studentsSnap =
await getDocs(studentsRef);



for(const student of studentsSnap.docs){


const data = student.data();



if(String(data.grade) === String(selectedGrade)){


const oldMarkRef =
doc(
db,
"students",
student.id,
"monthlyMarks",
examId
);



const oldMarkSnap =
await getDoc(oldMarkRef);



if(oldMarkSnap.exists()){


const oldData =
oldMarkSnap.data();



if(oldData.percentage > percentage){

rank++;

}


}


}


}

await setDoc(

doc(db,"students",indexNo,"monthlyMarks",month),

{

exam: examName,
testType: testType,

marks:marks,

total:total,

percentage:Number(percentage.toFixed(2)),

rank:rank

}

);



document.getElementById("markMessage").innerHTML =
"Marks Added Successfully ✅";


}


catch(error){


document.getElementById("markMessage").innerHTML =
error.message;


}


};

const testType =
document.getElementById("testType");

testType.addEventListener("change",function(){

document.getElementById("monthlyBox").style.display="none";
document.getElementById("termBox").style.display="none";
document.getElementById("paperBox").style.display="none";

if(this.value=="Monthly"){

document.getElementById("monthlyBox").style.display="block";

}

else if(this.value=="Term"){

document.getElementById("termBox").style.display="block";

}

else if(this.value=="Paper"){

document.getElementById("paperBox").style.display="block";

}

});

</script>
