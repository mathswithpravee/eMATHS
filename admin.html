<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard - Maths with Pravee</title>

<style>

body{
font-family:Arial;
background:#f4f7fb;
text-align:center;
}

.header{
background:#1e88e5;
color:white;
padding:25px;
}

.card{
background:white;
width:80%;
margin:20px auto;
padding:20px;
border-radius:10px;
}

button{
padding:12px 20px;
background:#1e88e5;
color:white;
border:none;
border-radius:5px;
}

</style>

</head>


<body>

<div class="header">

<h1>Maths with Pravee</h1>
<h3>Admin Dashboard</h3>

</div>


<div class="card">

<h2>➕ Add Student</h2>

<input id="indexNo" placeholder="Index No">

<br><br>

<input id="name" placeholder="Student Name">

<br><br>

<input id="grade" placeholder="Grade">

<br><br>

<input id="email" placeholder="Email">

<br><br>

<button onclick="addStudent()">
Save Student
</button>

<p id="message"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, doc, setDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",
  authDomain: "emaths-db8a2.firebaseapp.com",
  projectId: "emaths-db8a2",
  storageBucket: "emaths-db8a2.firebasestorage.app",
  messagingSenderId: "790474740591",
  appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.addStudent = async function(){
alert("Button working");
const indexNo = document.getElementById("indexNo").value;
const name = document.getElementById("name").value;
const grade = document.getElementById("grade").value;
const email = document.getElementById("email").value;


await setDoc(doc(db,"students",indexNo),{

name: name,
grade: grade,
email: email

});


document.getElementById("message").innerHTML =
"Student Added Successfully ✅";

}

</script>
</body>

</html>
