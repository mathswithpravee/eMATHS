window.addStudent = async function(){


try{


const indexNo =
document.getElementById("indexNo").value.trim();



const name =
document.getElementById("studentName").value.trim();



const grade =
document.getElementById("studentGrade").value.trim();



const email =
document.getElementById("email").value.trim();



const password =
document.getElementById("password").value.trim();




if(indexNo=="" || name=="" || grade==""){


document.getElementById("message").innerHTML =
"Please fill Index, Name and Grade ❌";


return;

}





await setDoc(

doc(db,"students",indexNo),

{

name:name,

grade:grade,

email:email,

password:password

}

);




document.getElementById("message").innerHTML =

"Student Added Successfully ✅";




}

catch(error){


document.getElementById("message").innerHTML =

error.message;


}



};


let selectedStudentID = "";


// SEARCH STUDENT

window.searchStudent = async function(){


const indexNo =
document.getElementById("searchIndex").value.trim();



if(indexNo==""){

document.getElementById("studentMessage").innerHTML =
"Enter Index No ❌";

return;

}



const studentRef =
doc(db,"students",indexNo);



const studentSnap =
await getDoc(studentRef);



if(studentSnap.exists()){


const data =
studentSnap.data();



selectedStudentID = indexNo;



document.getElementById("editName").value =
data.name;


document.getElementById("editGrade").value =
data.grade;


document.getElementById("editEmail").value =
data.email;



document.getElementById("studentMessage").innerHTML =
"Student Found ✅";


}

else{


document.getElementById("studentMessage").innerHTML =
"Student Not Found ❌";


}


};





// UPDATE STUDENT

window.updateStudent = async function(){


if(selectedStudentID==""){


document.getElementById("studentMessage").innerHTML =
"Search Student First ❌";


return;

}



await setDoc(

doc(db,"students",selectedStudentID),

{


name:
document.getElementById("editName").value,


grade:
document.getElementById("editGrade").value,


email:
document.getElementById("editEmail").value


},

{merge:true}


);



document.getElementById("studentMessage").innerHTML =
"Student Updated Successfully ✅";


};






// DELETE STUDENT

window.deleteStudent = async function(){


if(selectedStudentID==""){

// SEARCH MARKS

window.searchMarks = async function(){


try{

const examID =

const markRef =
doc(

db,

"students",

indexNo,

);

await getDoc(markRef);



if(markSnap.exists()){

// UPDATE MARKS


window.updateMarks = async function(){


try{


const marks =
Number(document.getElementById("editMarks").value);



const total =
Number(document.getElementById("editTotal").value);



const percentage =
Number(((marks/total)*100).toFixed(2));



await setDoc(

doc(

db,

"students",

selectedMarksStudent,

"monthlyMarks",

selectedExamID

),


{

document.getElementById("editExam").value,


marks:marks,


total:total,

// ==========================
// LOAD STUDENTS BY GRADE
// ==========================


const gradeSelect =
document.getElementById("markGrade");


const studentSelect =
document.getElementById("studentSelect");




gradeSelect.addEventListener("change",async function(){



studentSelect.innerHTML =

`
<option value="">
Select Student
</option>
`;



const selectedGrade =
gradeSelect.value;



const studentsRef =
collection(db,"students");



const snapshot =
await getDocs(studentsRef);




snapshot.forEach((student)=>{


const data =
student.data();




// grade match

if(String(data.grade)==String(selectedGrade)){



let option =
document.createElement("option");



option.value =
student.id;



option.textContent =
student.id+" - "+data.name;



studentSelect.appendChild(option);



}



});



});

// ==========================
// TEST TYPE CHANGE
// ==========================


const testType =
document.getElementById("testType");


testType.addEventListener("change",function(){


document.getElementById("monthlyBox").style.display="none";

document.getElementById("termBox").style.display="none";

document.getElementById("paperBox").style.display="none";



if(this.value=="Monthly"){

document.getElementById("monthlyBox").style.display="block";

}

else if(this.value=="Term"){

document.getElementById("termBox").style.display="block";

}

else if(this.value=="Paper"){

document.getElementById("paperBox").style.display="block";

}


});





// ==========================
// PERCENTAGE AUTO CALCULATE
// ==========================


document.getElementById("marks")
.addEventListener("input",calculatePercentage);


document.getElementById("total")
.addEventListener("input",calculatePercentage);



function calculatePercentage(){


let marks =
Number(document.getElementById("marks").value);


let total =
Number(document.getElementById("total").value);



if(total>0){


document.getElementById("percentage").value =

((marks/total)*100).toFixed(2);


}



}







// ==========================
// SAVE MARKS
// ==========================


window.addMarks = async function(){


try{


const indexNo =
document.getElementById("studentSelect").value;



const grade =
document.getElementById("markGrade").value;



const type =
document.getElementById("testType").value;



let examId="";

let examName="";




// Monthly

if(type=="Monthly"){


let year =
document.getElementById("year").value;


let month =
document.getElementById("month").value;



if(year=="" || month==""){

throw new Error("Select Year and Month");

}



examId =
year+"-"+month;



examName =
month+" Monthly Test";


}




// Term

else if(type=="Term"){


let term =
document.getElementById("term").value;



if(term==""){

throw new Error("Select Term");

}



examId =
"Term-"+term;


examName =
"Term "+term+" Test";


}




// Paper

else if(type=="Paper"){


let paper =
document.getElementById("paperNo").value;



if(paper==""){

throw new Error("Enter Paper Number");

}



examId =
"Paper-"+paper;


examName =
"Paper Class "+paper;


}





const marks =
Number(document.getElementById("marks").value);


const total =
Number(document.getElementById("total").value);



const percentage =
Number(((marks/total)*100).toFixed(2));



if(indexNo==""){

throw new Error("Select Student");

}





// Rank calculation


let rank=1;



const students =
await getDocs(collection(db,"students"));



for(const student of students.docs){



const data =
student.data();



if(String(data.grade)==String(grade)){



const oldRef =
doc(

db,

"students",

student.id,

"monthlyMarks",

examId

);



const oldSnap =
await getDoc(oldRef);



if(oldSnap.exists()){



const old =
oldSnap.data();



if(old.percentage > percentage){

rank++;

}


}



}


}





await setDoc(

doc(

db,

"students",

indexNo,

"monthlyMarks",

examId

),


{


exam:examName,

testType:type,

marks:marks,

total:total,

percentage:percentage,

rank:rank


}

);




document.getElementById("markMessage").innerHTML =

"Marks Added Successfully ✅";



}


catch(error){


document.getElementById("markMessage").innerHTML =

error.message;


}



};

const snapshot =
await getDocs(collection(db,"exams"));



snapshot.forEach((exam)=>{


const data =
exam.data();



box.innerHTML += `


<div style="background:#eee;padding:15px;margin:15px;border-radius:10px;">


<h3>${data.title}</h3>


<p>Grade: ${data.grade}</p>


<button onclick="editExam('${exam.id}')">

✏ Edit

</button>


<button onclick="deleteExam('${exam.id}')">

🗑 Delete

</button>


</div>


`;



});


}



loadAdminExams();




// ========================
// LOAD EXAM TO EDIT FORM
// ========================

window.editExam = async function(id){


const examSnap =
await getDoc(doc(db,"exams",id));


if(examSnap.exists()){


const data =
examSnap.data();


document.getElementById("editExamId").value=id;

document.getElementById("editExamTitle").value=data.title;

document.getElementById("editExamGrade").value=data.grade;



window.scrollTo({

top:0,

behavior:"smooth"

});


}


};




// ========================
// UPDATE EXAM
// ========================

window.updateExam = async function(){


const id =
document.getElementById("editExamId").value;


await updateDoc(

doc(db,"exams",id),

{

title:
document.getElementById("editExamTitle").value,


grade:
document.getElementById("editExamGrade").value


}

);


alert("Exam Updated Successfully ✅");


loadAdminExams();


};




// ========================
// DELETE EXAM
// ========================

window.deleteExam = async function(id){


let confirmDelete =
confirm("Delete this exam and all questions?");


if(!confirmDelete){

return;

}



const questionsRef =
collection(
db,
"exams",
id,
"questions"
);



const questionsSnap =
await getDocs(questionsRef);



for(const question of questionsSnap.docs){


await deleteDoc(

doc(
db,
"exams",
id,
"questions",
question.id
)

);


}




await deleteDoc(

doc(db,"exams",id)

);



alert("Exam and Questions Deleted Successfully ✅");



loadAdminExams();



};

    
</script>


</body>

</html>
