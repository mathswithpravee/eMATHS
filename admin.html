<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard - Maths with Pravee</title>

<style>

body{
font-family:Arial;
background:#f4f7fb;
text-align:center;
}

.header{
background:#1e88e5;
color:white;
padding:25px;
}

.card{
background:white;
width:80%;
margin:20px auto;
padding:20px;
border-radius:10px;
}

input,select{
padding:10px;
width:70%;
}

button{
padding:12px 20px;
background:#1e88e5;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.success{
color:green;
}

.error{
color:red;
}

</style>

</head>


<body>


<div class="header">

<h1>Maths with Pravee</h1>

<h3>Admin Dashboard</h3>

</div>



<!-- ADD STUDENT -->

<div class="card">

<h2>➕ Add Student</h2>


<input id="indexNo" placeholder="Index No">

<br><br>


<input id="studentName" placeholder="Student Name">

<br><br>


<input id="studentGrade" placeholder="Grade">

<br><br>


<input id="email" placeholder="Email">

<br><br>


<input id="password" placeholder="Password">


<br><br>


<button onclick="addStudent()">

Save Student

</button>


<p id="message"></p>


</div>





<!-- ADD MARKS -->

<div class="card">

<h2>📊 Add Marks</h2>



<select id="markGrade">

<option value="">
Select Grade
</option>


<option value="6">Grade 6</option>

<option value="7">Grade 7</option>

<option value="8">Grade 8</option>

<option value="9">Grade 9</option>

<option value="10">Grade 10</option>

<option value="11">Grade 11</option>


</select>


<br><br>




<select id="studentSelect">


<option value="">
Select Student
</option>


</select>


<br><br>





<select id="testType">


<option value="">
Select Test Type
</option>


<option value="Monthly">
Monthly Test
</option>


<option value="Term">
Term Test
</option>


<option value="Paper">
Paper Class
</option>


</select>


<br><br>





<div id="monthlyBox" style="display:none;">


<select id="year">


<option value="">
Select Year
</option>


<option value="2026">
2026
</option>


<option value="2027">
2027
</option>


</select>


<br><br>



<select id="month">


<option value="">
Select Month
</option>


<option value="01">January</option>

<option value="02">February</option>

<option value="03">March</option>

<option value="04">April</option>

<option value="05">May</option>

<option value="06">June</option>

<option value="07">July</option>

<option value="08">August</option>

<option value="09">September</option>

<option value="10">October</option>

<option value="11">November</option>

<option value="12">December</option>


</select>


</div>





<div id="termBox" style="display:none;">


<select id="term">


<option value="">
Select Term
</option>


<option value="1">
Term 1
</option>


<option value="2">
Term 2
</option>


<option value="3">
Term 3
</option>


</select>


</div>





<div id="paperBox" style="display:none;">


<input id="paperNo" placeholder="Paper Number">


</div>



<br><br>


<input id="marks" placeholder="Marks">


<br><br>


<input id="total" placeholder="Total Marks">


<br><br>


<input id="percentage" placeholder="Percentage" readonly>


<br><br>


<button onclick="addMarks()">

Save Marks

</button>


<p id="markMessage"></p>


</div>
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
doc,
setDoc,
collection,
getDocs,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);





// ==========================
// ADD STUDENT
// ==========================


window.addStudent = async function(){


try{


const indexNo =
document.getElementById("indexNo").value.trim();



const name =
document.getElementById("studentName").value.trim();



const grade =
document.getElementById("studentGrade").value.trim();



const email =
document.getElementById("email").value.trim();



const password =
document.getElementById("password").value.trim();




if(indexNo=="" || name=="" || grade==""){


document.getElementById("message").innerHTML =
"Please fill Index, Name and Grade ❌";


return;

}





await setDoc(

doc(db,"students",indexNo),

{

name:name,

grade:grade,

email:email,

password:password

}

);




document.getElementById("message").innerHTML =

"Student Added Successfully ✅";




}

catch(error){


document.getElementById("message").innerHTML =

error.message;


}



};







// ==========================
// LOAD STUDENTS BY GRADE
// ==========================


const gradeSelect =
document.getElementById("markGrade");


const studentSelect =
document.getElementById("studentSelect");




gradeSelect.addEventListener("change",async function(){



studentSelect.innerHTML =

`
<option value="">
Select Student
</option>
`;



const selectedGrade =
gradeSelect.value;



const studentsRef =
collection(db,"students");



const snapshot =
await getDocs(studentsRef);




snapshot.forEach((student)=>{


const data =
student.data();




// grade match

if(String(data.grade)==String(selectedGrade)){



let option =
document.createElement("option");



option.value =
student.id;



option.textContent =
student.id+" - "+data.name;



studentSelect.appendChild(option);



}



});



});

// ==========================
// TEST TYPE CHANGE
// ==========================


const testType =
document.getElementById("testType");


testType.addEventListener("change",function(){


document.getElementById("monthlyBox").style.display="none";

document.getElementById("termBox").style.display="none";

document.getElementById("paperBox").style.display="none";



if(this.value=="Monthly"){

document.getElementById("monthlyBox").style.display="block";

}

else if(this.value=="Term"){

document.getElementById("termBox").style.display="block";

}

else if(this.value=="Paper"){

document.getElementById("paperBox").style.display="block";

}


});





// ==========================
// PERCENTAGE AUTO CALCULATE
// ==========================


document.getElementById("marks")
.addEventListener("input",calculatePercentage);


document.getElementById("total")
.addEventListener("input",calculatePercentage);



function calculatePercentage(){


let marks =
Number(document.getElementById("marks").value);


let total =
Number(document.getElementById("total").value);



if(total>0){


document.getElementById("percentage").value =

((marks/total)*100).toFixed(2);


}



}







// ==========================
// SAVE MARKS
// ==========================


window.addMarks = async function(){


try{


const indexNo =
document.getElementById("studentSelect").value;



const grade =
document.getElementById("markGrade").value;



const type =
document.getElementById("testType").value;



let examId="";

let examName="";




// Monthly

if(type=="Monthly"){


let year =
document.getElementById("year").value;


let month =
document.getElementById("month").value;



if(year=="" || month==""){

throw new Error("Select Year and Month");

}



examId =
year+"-"+month;



examName =
month+" Monthly Test";


}




// Term

else if(type=="Term"){


let term =
document.getElementById("term").value;



if(term==""){

throw new Error("Select Term");

}



examId =
"Term-"+term;


examName =
"Term "+term+" Test";


}




// Paper

else if(type=="Paper"){


let paper =
document.getElementById("paperNo").value;



if(paper==""){

throw new Error("Enter Paper Number");

}



examId =
"Paper-"+paper;


examName =
"Paper Class "+paper;


}





const marks =
Number(document.getElementById("marks").value);


const total =
Number(document.getElementById("total").value);



const percentage =
Number(((marks/total)*100).toFixed(2));



if(indexNo==""){

throw new Error("Select Student");

}





// Rank calculation


let rank=1;



const students =
await getDocs(collection(db,"students"));



for(const student of students.docs){



const data =
student.data();



if(String(data.grade)==String(grade)){



const oldRef =
doc(

db,

"students",

student.id,

"monthlyMarks",

examId

);



const oldSnap =
await getDoc(oldRef);



if(oldSnap.exists()){



const old =
oldSnap.data();



if(old.percentage > percentage){

rank++;

}


}



}


}





await setDoc(

doc(

db,

"students",

indexNo,

"monthlyMarks",

examId

),


{


exam:examName,

testType:type,

marks:marks,

total:total,

percentage:percentage,

rank:rank


}

);




document.getElementById("markMessage").innerHTML =

"Marks Added Successfully ✅";



}


catch(error){


document.getElementById("markMessage").innerHTML =

error.message;


}



};


</script>


</body>

</html>
