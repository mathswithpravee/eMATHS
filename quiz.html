<!DOCTYPE html>
<html>

<head>

<title>Quiz - Maths with Pravee</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
font-family:Arial;
background:#f4f7fb;
text-align:center;
margin:0;
}


.header{
background:#1e88e5;
color:white;
padding:20px;
}


.card{

background:white;
width:90%;
max-width:700px;
margin:20px auto;
padding:20px;
border-radius:10px;

}


.question{

background:#eeeeee;
padding:15px;
margin:15px;
border-radius:10px;
text-align:left;

}


button{

background:#1e88e5;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
cursor:pointer;

}


#timer{

color:red;
font-size:22px;
font-weight:bold;

}

</style>

</head>



<body>


<div class="header">

<h1>📝 Quiz</h1>

<h3>Maths with Pravee</h3>

</div>




<div class="card">


<h2 id="examTitle">
Loading...
</h2>


<h3 id="timer">
Time Loading...
</h3>



<form id="quizForm">

</form>



<br>


<button onclick="submitQuiz(false)">

Submit Quiz

</button>



<h3 id="result"></h3>


</div>







<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

doc,

getDoc,

collection,

getDocs,

setDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";






const firebaseConfig = {


apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"

};






const app = initializeApp(firebaseConfig);


const db = getFirestore(app);







const examId =

localStorage.getItem("examId");



const studentIndex =

localStorage.getItem("studentIndex");



const studentGrade =

localStorage.getItem("studentGrade");







if(!studentIndex || !studentGrade || !examId){


window.location.href="index.html";


}







let questions=[];


let examName="";


let examTime=10;


let timeLeft=0;


let timerInterval;


let submitted=false;







async function loadQuiz(){



const examSnap = await getDoc(

doc(db,"exams",examId)

);







if(!examSnap.exists()){


alert("Exam not found");


window.location.href="exam.html";


return;


}







const examData = examSnap.data();







if(String(examData.grade)!==String(studentGrade)){


alert("You cannot access this exam");


window.location.href="exam.html";


return;


}







examName = examData.title;



document.getElementById("examTitle").innerHTML =

examName;






// GET TIME FROM FIRESTORE


examTime = Number(examData.time || 10);



startTimer();







const qSnap = await getDocs(

collection(

db,

"exams",

examId,

"questions"

)

);







const form =

document.getElementById("quizForm");






qSnap.forEach((q,index)=>{


const data = q.data();



questions.push(data);






form.innerHTML += `


<div class="question">


<h3>${index+1}. ${data.question}</h3>


<label>

<input type="radio" name="q${index}" value="A">

A. ${data.A}

</label>


<br>


<label>

<input type="radio" name="q${index}" value="B">

B. ${data.B}

</label>


<br>


<label>

<input type="radio" name="q${index}" value="C">

C. ${data.C}

</label>


<br>


<label>

<input type="radio" name="q${index}" value="D">

D. ${data.D}

</label>


</div>


`;



});


}
// =======================
// TIMER
// =======================


function startTimer(){


timeLeft = examTime * 60;



timerInterval = setInterval(()=>{


let minutes = Math.floor(timeLeft / 60);


let seconds = timeLeft % 60;



document.getElementById("timer").innerHTML =


"⏱ Time Left : " +

minutes + ":" +

(seconds < 10 ? "0" : "") +

seconds;





if(timeLeft <= 0){



clearInterval(timerInterval);



alert("⏰ Time Over! Exam Submitted Automatically");



submitQuiz(true);



return;


}




timeLeft--;



},1000);



}






// =======================
// SUBMIT QUIZ
// =======================


window.submitQuiz = async function(autoSubmit=false){



if(submitted){

return;

}




submitted=true;



clearInterval(timerInterval);







const resultRef = doc(

db,

"students",

studentIndex,

"examResults",

examId

);






// CHECK DUPLICATE RESULT



const oldResult = await getDoc(resultRef);






if(oldResult.exists()){



document.getElementById("result").innerHTML =


"❌ You already completed this exam";



return;


}







let score=0;






questions.forEach((q,index)=>{



const selected = document.querySelector(

`input[name="q${index}"]:checked`

);






if(selected && selected.value == q.answer){



score++;


}



});







const percentage =


((score/questions.length)*100).toFixed(2);







await setDoc(


resultRef,


{


exam:examName,


score:score,


total:questions.length,


percentage:Number(percentage),


date:new Date()



}



);







document.getElementById("result").innerHTML =


`

✅ Quiz Completed

<br><br>


Score : ${score}/${questions.length}


<br>


Percentage : ${percentage}%


`;







};








loadQuiz();



</script>


</body>


</html>
