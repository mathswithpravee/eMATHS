<!DOCTYPE html>
<html>
<head>
<title>Student Login - Maths with Pravee</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>

<style>
body{
    font-family: Arial;
    background:#f4f7fb;
    text-align:center;
}

.login-box{
    background:white;
    width:300px;
    margin:80px auto;
    padding:30px;
    border-radius:10px;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 25px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Student Login</h2>

<input id="indexNo" type="text" placeholder="Student Index No">
<br>

<input id="password" type="password" placeholder="Password">
<br>

<button onclick="login()">Login</button>

<p id="message"></p>

</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = { apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",
  authDomain: "emaths-db8a2.firebaseapp.com",
  projectId: "emaths-db8a2",
  storageBucket: "emaths-db8a2.firebasestorage.app",
  messagingSenderId: "790474740591",
  appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);



window.login = async function(){

const indexNo = document.getElementById("indexNo").value;
const password = document.getElementById("password").value;


try {

    // Find student by index number
    const studentRef = doc(db, "students", indexNo);
    const studentSnap = await getDoc(studentRef);


    if(studentSnap.exists()){

        const studentData = studentSnap.data();

        // Login using stored email
        await signInWithEmailAndPassword(
            auth,
            studentData.email,
            password
        );


        localStorage.setItem("studentIndex", indexNo);

window.location.href = "dashboard.html";


    }else{

        document.getElementById("message").innerHTML =
        "Invalid Index Number";

    }


} catch(error){

    document.getElementById("message").innerHTML =
    "Wrong Password";

}


}

</script>


</body>
</html>
