<!DOCTYPE html>
<html>
<head>
<title>Student Login - Maths with Pravee</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>

<style>
body{
    font-family: Arial;
    background:#f4f7fb;
    text-align:center;
}

.login-box{
    background:white;
    width:300px;
    margin:80px auto;
    padding:30px;
    border-radius:10px;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 25px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Student Login</h2>

<input id="email" type="email" placeholder="Email">
<br>

<input id="password" type="password" placeholder="Password">
<br>

<button onclick="login()">Login</button>

<p id="message"></p>

</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",
  authDomain: "emaths-db8a2.firebaseapp.com",
  projectId: "emaths-db8a2",
  storageBucket: "emaths-db8a2.firebasestorage.app",
  messagingSenderId: "790474740591",
  appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


window.login = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;


signInWithEmailAndPassword(auth,email,password)

.then(()=>{
document.getElementById("message").innerHTML="Login Successful!";
})

.catch(()=>{
document.getElementById("message").innerHTML="Login Failed!";
});

}

</script>


</body>
</html>
