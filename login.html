<!DOCTYPE html>
<html>

<head>

<title>Login - Maths with Pravee</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

font-family:Arial;
background:#f4f7fb;
text-align:center;
margin:0;

}


.card{

background:white;
width:90%;
max-width:400px;
margin:80px auto;
padding:25px;
border-radius:10px;

}



input{

width:90%;
padding:12px;
margin:10px;
font-size:16px;

}



button{

width:90%;
padding:12px;
margin-top:10px;
background:#1e88e5;
color:white;
border:none;
border-radius:5px;
font-size:16px;

}


#message{

color:red;
margin-top:15px;

}


</style>


</head>


<body>



<div class="card">


<h2>📚 Maths with Pravee</h2>


<h3>Login</h3>



<input 
id="email"
placeholder="Email">


<br>


<input 
id="password"
type="password"
placeholder="Password">



<br>


<button onclick="login()">

Login

</button>



<p id="message"></p>



</div>







<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

getFirestore,

doc,

getDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";






const firebaseConfig = {


apiKey: "AIzaSyAI-rbO_z9fzIZicTW2SlI0cj__R1Ji6GM",

authDomain: "emaths-db8a2.firebaseapp.com",

projectId: "emaths-db8a2",

storageBucket: "emaths-db8a2.firebasestorage.app",

messagingSenderId: "790474740591",

appId: "1:790474740591:web:a54ea2419f29c0178a8e9a"


};






const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);







window.login = async function(){



const email =

document.getElementById("email").value;



const password =

document.getElementById("password").value;






try{



const userCredential =

await signInWithEmailAndPassword(

auth,

email,

password

);





const uid =

userCredential.user.uid;







const userDoc =

await getDoc(

doc(db,"users",uid)

);






if(!userDoc.exists()){


document.getElementById("message").innerHTML =

"User profile not found ❌";


return;


}







const userData = userDoc.data();







if(userData.role === "admin"){



window.location.href = "admin.html";



}






else if(userData.role === "student"){



localStorage.setItem(

"studentIndex",

userData.indexNo

);



localStorage.setItem(

"studentGrade",

userData.grade

);



window.location.href = "dashboard.html";



}






else{


document.getElementById("message").innerHTML =

"Invalid User Role ❌";


}



}




catch(error){


document.getElementById("message").innerHTML =

error.message;


}



};



</script>



</body>


</html>
